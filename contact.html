<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Neighbors | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">🌿 Green Neighbors</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="privacy.html">Privacy</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>
</header>

<main>
    <section class="page-hero contact-hero">
        <span class="tagline">💬 We'd Love to Hear From You</span>
        <h1>Get in Touch</h1>
        <p>
            Have a question, suggestion, or idea?
            Send us a message!
        </p>
    </section>

    <section class="form-section">
        <form action="#" method="get">

            <h2>🌿 Send Us a Message</h2>

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn submit-btn">
                Send Message →
            </button>

            <p class="form-note">
                Thank you for supporting Green Neighbors!
            </p>

        </form>
    </section>
</main>

<footer>
    <p>© 2026 Green Neighbors | Cleaner Community, Greener Tomorrow.</p>
    <a href="privacy.html">Privacy Statement</a>
</footer>

</body>
</html>
